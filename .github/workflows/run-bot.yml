name: 24/7 Minecraft Bot
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm install
    - name: Run Minecraft Bot
      run: |
        timeout 4.5h node index.js
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 254 ] || [ $EXIT_CODE -eq 0 ]; then
          echo "Bot stopped cleanly by timeout. Ready for next loop!"
          exit 0
        else
          echo "Bot crashed with unexpected exit code: $EXIT_CODE"
          exit $EXIT_CODE
        fi
