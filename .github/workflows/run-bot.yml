name: 24/7 Minecraft Bot
on:
  push:
    branches: [ main ]
  schedule:
    # Safely loops the deployment environment container context
    - cron: '0 */5 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24 # <-- Explicitly updated to Node 24 to stop the warnings
    - run: npm install
    - run: timeout 4.5h node index.js || true
